# A sample job for export_data_by_table_with_tags.

resources:
  jobs:
    sample_job:
      name: Export Data To External Location

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: WEEKS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: table
          default: ${var.table}
        - name: destination_abfss
          default: ${var.destination_abfss}

      tags:
        customer: ${var.customerTagValue}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/export_delta_data_to_abfss.ipynb
          libraries:
            - pypi: 
                package: datetime
            - pypi: 
                package: databricks-sdk

      environments:
        - environment_key: default
          spec:
            environment_version: "4"